services:
  web:
    build: .
    container_name: research-web-app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    restart: unless-stopped
    depends_on:
      - mqtt

  mqtt:
    image: eclipse-mosquitto:2
    container_name: research-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  sensor:
    build: .
    container_name: research-sensor
    command: python sensor_simulator.py
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - mqtt